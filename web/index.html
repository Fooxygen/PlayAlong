<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayAlong</title>
    <!-- Local compiled CSS -->
    <link rel="stylesheet" href="assets/css/app.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">

</head>
<body class="bg-kawaii-pattern min-h-screen text-[#2d2d3a] flex flex-col justify-between relative overflow-x-hidden">

    <!-- Top Decorative Header Line -->
    <div class="h-3 bg-gradient-to-r from-pink-400 via-purple-400 to-indigo-400 border-b-4 border-[#2d2d3a]"></div>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow grid place-items-center p-4 sm:p-6 md:p-8 relative">

        <!-- ================= PAGE 1: HOME / LANDING PAGE ================= -->
        <section id="page-home" class="page-view page-visible flex flex-col items-center justify-center text-center w-full py-8">
            
            <!-- Kawaii Decorative Tech Badges -->
            <div class="inline-flex items-center gap-2 bg-yellow-300 px-4 py-1.5 rounded-full border-2 border-[#2d2d3a] font-extrabold text-xs sm:text-sm tracking-wider uppercase mb-8 shadow-[3px_3px_0px_#2d2d3a]">
                <i class="fa-solid font-bold fa-sparkles text-pink-500"></i>
                <span>Interactive AI Story Game</span>
                <i class="fa-solid font-bold fa-heart text-pink-500"></i>
            </div>

            <!-- HERO WORDMARK -->
            <section class="wordmark-section" onclick="startGame()" aria-label="PlayAlong">
                <canvas id="wordmark-canvas" aria-hidden="true"></canvas>
                <h1 class="sr-only">PlayAlong</h1>
            </section>

            <!-- Description -->
            <p class="text-gray-600 font-bold text-sm sm:text-base max-w-md mt-6 mb-10 leading-relaxed bg-white/70 backdrop-blur-sm p-4 rounded-2xl border-2 border-[#2d2d3a]/20">
                你顶替了一个失踪的人，手里只有他不完整的记忆。别让他们发现，你根本不是他。
            </p>

            <!-- START BUTTON (Large Pill Button) -->
            <button onclick="startGame()" class="kawaii-btn bg-pink-400 hover:bg-pink-300 text-white font-black text-xl sm:text-2xl px-12 py-4 rounded-full flex items-center gap-4 group cursor-pointer">
                <span>START GAME</span>
                <div class="w-10 h-10 bg-white rounded-full text-pink-500 flex items-center justify-center text-lg group-hover:translate-x-1 transition-transform">
                    <i class="fa-solid fa-play"></i>
                </div>
            </button>

            <!-- Bottom Kawaii Decorative Stat -->
            <div class="flex items-center gap-6 mt-12 text-xs font-bold text-gray-500">
                <span class="flex items-center gap-1.5"><i class="fa-solid fa-bolt text-yellow-500"></i> 记忆留痕</span>
                <span class="flex items-center gap-1.5"><i class="fa-solid fa-face-smile text-pink-400"></i> 趣味剧情</span>
                <span class="flex items-center gap-1.5"><i class="fa-solid fa-wand-magic-sparkles text-purple-400"></i> 身份博弈</span>
            </div>
        </section>


        <!-- ================= PAGE 2: CASE SELECTION PAGE ================= -->
        <section id="page-cases" class="page-view page-hidden page-gone max-w-4xl w-full my-auto py-4">
            
            <!-- Top Action Header -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-8 bg-white p-4 sm:p-5 rounded-3xl border-[3px] border-[#2d2d3a] shadow-[5px_5px_0px_#2d2d3a]">
                
                <!-- Page Title -->
                <div class="flex items-center gap-3">
                    <button onclick="goHome()" class="kawaii-btn w-10 h-10 bg-gray-100 hover:bg-gray-200 rounded-xl flex items-center justify-center text-[#2d2d3a] font-bold" title="返回主页">
                        <i class="fa-solid fa-house"></i>
                    </button>
                    <div>
                        <h2 class="text-xl sm:text-2xl font-black text-[#2d2d3a] flex items-center gap-2">
                            <span>选择剧本</span>
                        </h2>
                        <p class="text-xs text-gray-500 font-bold">每一份案卷，都是一个你不认识的人生。选一份，开始顶替。</p>
                    </div>
                </div>

                <!-- Right Control Buttons (Random Selector & Home) -->
                <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                    <!-- Random Select Button -->
                    <button onclick="selectRandomCase()" class="kawaii-btn bg-yellow-300 hover:bg-yellow-200 text-[#2d2d3a] font-extrabold text-sm px-5 py-2.5 rounded-2xl flex items-center justify-center gap-2 w-full sm:w-auto">
                        <i class="fa-solid fa-dice text-lg text-purple-600"></i>
                        <span>随机挑选</span>
                    </button>
                </div>
            </div>

            <!-- CASES GRID CONTAINER -->
            <div id="cases-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5">
                <!-- Case Items will be dynamically generated via JavaScript -->
            </div>
        </section>

        <!-- ================= PAGE 3: CHAT ================= -->
        <section id="page-chat" class="page-view page-hidden page-gone w-full h-full flex items-center justify-center relative overflow-hidden">
            <div class="chat-stage">
            <div class="chat-panel flex flex-col bg-white/90 border-[3px] border-[#2d2d3a] rounded-3xl shadow-[8px_8px_0px_#2d2d3a] overflow-hidden">
                <header class="flex items-center gap-3 px-4 sm:px-5 py-3 border-b-[3px] border-[#2d2d3a] bg-pink-100">
                    <button onclick="leaveChat()" class="kawaii-btn w-9 h-9 shrink-0 bg-white hover:bg-gray-100 rounded-xl flex items-center justify-center text-[#2d2d3a]" title="返回案卷">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div class="min-w-0 flex-1">
                        <div class="text-xs sm:text-sm font-black tracking-widest text-pink-500 uppercase">Current Case</div>
                        <h2 id="chat-title" class="text-xl sm:text-2xl font-black text-[#2d2d3a] truncate">对话</h2>
                    </div>
                </header>

                <div id="chat-messages" class="flex-1 overflow-y-auto px-4 py-5 space-y-4 bg-[#fdfbfb]/80"></div>

                <form id="chat-form" class="p-3 sm:p-4 border-t-[3px] border-[#2d2d3a] bg-white flex gap-2">
                    <input
                        id="chat-input"
                        type="text"
                        autocomplete="off"
                        placeholder="输入你的回答，按 Enter 发送……"
                        class="flex-1 min-w-0 px-4 py-3 rounded-2xl border-[3px] border-[#2d2d3a] bg-[#f7f4ff] text-sm font-bold text-[#2d2d3a] outline-none focus:bg-white"
                    >
                    <button id="chat-send" type="submit" class="kawaii-btn bg-pink-400 hover:bg-pink-300 text-white font-black px-4 sm:px-5 py-3 rounded-2xl flex items-center justify-center gap-2">
                        <span>发送</span>
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>

            <aside id="ending-panel" class="ending-panel flex flex-col bg-white/95 border-[3px] border-[#2d2d3a] rounded-3xl shadow-[8px_8px_0px_#2d2d3a] overflow-hidden">
                <header class="px-5 py-4 border-b-[3px] border-[#2d2d3a] bg-pink-100">
                    <div class="text-xs font-black tracking-widest text-pink-500 uppercase">Case Closed</div>
                    <h2 class="text-xl font-black text-[#2d2d3a]">结局</h2>
                </header>

                <div id="ending-content" class="ending-content flex-1 overflow-y-auto px-5 sm:px-7 py-6 bg-[#fdfbfb]/80"></div>

                <footer class="p-3 sm:p-4 border-t-[3px] border-[#2d2d3a] bg-white">
                    <button onclick="replayGame()" class="kawaii-btn w-full bg-pink-400 hover:bg-pink-300 text-white font-black text-lg py-3 rounded-2xl">
                        再来一局
                    </button>
                </footer>
            </aside>
            </div>
        </section>

    </main>

    <!-- INTERACTION MODAL (Simulates Entering a Game Flow) -->
    <div id="game-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="kawaii-card bg-white max-w-md w-full rounded-3xl p-6 sm:p-8 relative transform scale-90 transition-transform duration-300" id="modal-card">
            
            <!-- Modal Close Button -->
            <button onclick="closeModal()" class="absolute top-4 right-4 w-9 h-9 bg-gray-100 hover:bg-red-100 text-gray-600 hover:text-red-500 rounded-full border-2 border-[#2d2d3a] flex items-center justify-center font-bold transition">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <!-- Modal Content Area -->
            <div class="text-center">
                <h3 id="modal-title" class="text-2xl font-black text-[#2d2d3a] mb-2">
                    Case Title
                </h3>

                <p id="modal-desc" class="text-sm font-bold text-gray-600 mb-6 leading-relaxed">
                    Case Description goes here...
                </p>

                <div class="bg-gray-50 p-4 rounded-2xl border-2 border-dashed border-gray-300 mb-6 text-left">
                    <div class="text-xs font-black text-gray-400 mb-1">FLOW PARAMETERS</div>
                    <div id="modal-meta" class="text-xs font-bold text-gray-700 space-y-1">
                        <!-- Dynamic metadata -->
                    </div>
                </div>

                <button onclick="startChatFromModal()" class="kawaii-btn bg-cyan-400 hover:bg-cyan-300 text-[#2d2d3a] font-black text-lg py-3.5 px-8 rounded-2xl w-full flex items-center justify-center gap-2">
                    <i class="fa-solid fa-comments"></i>
                    <span>进入对话</span>
                </button>
            </div>
        </div>
    </div>


    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Case 列表由后端 /api/cases 提供
        let casesData = [];
        let selectedCase = null;
        let conversationId = "";
        let chatSending = false;
        let lastSpeaker = "";

        const TYPE_SPEED = 26;
        const NARRATION_SPEED = 22;
        const EXPRESSION_SPEED = 22;
        const MESSAGE_GAP = 1000;
        const EXPRESSION_GAP = 650;
        const SPEAKER_GAP = 400;

        async function loadCases() {
            const container = document.getElementById('cases-grid');
            container.innerHTML = `<div class="col-span-full text-center text-sm font-bold text-gray-500 py-10">正在调取案卷……</div>`;

            try {
                const response = await fetch('/api/cases');
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || '加载失败');

                casesData = (data.cases || []).map(toCaseCard);
                renderCases();
            } catch (error) {
                container.innerHTML = `<div class="col-span-full text-center text-sm font-bold text-red-500 py-10">无法加载案卷：${error.message}</div>`;
            }
        }

        function toCaseCard(item) {
            const difficulty = Math.max(1, Math.min(5, Number(item.difficulty) || 1));

            return {
                id: item.pack_id,
                title: item.title,
                subtitle: [item.name, item.occupation].filter(Boolean).join(' · '),
                desc: item.description || item.disappearance || '',
                difficulty: '★'.repeat(difficulty) + '☆'.repeat(5 - difficulty),
                turns: item.rounds ? `约 ${item.rounds} 轮` : '回合未知'
            };
        }

        // 页面初始化：加载 Case 列表
        document.addEventListener('DOMContentLoaded', () => {
            loadCases();
        });

        // 渲染 Case 列表到 DOM
        function renderCases() {
            const container = document.getElementById('cases-grid');
            container.innerHTML = '';

            casesData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `kawaii-card bg-white p-5 rounded-3xl cursor-pointer relative flex flex-col justify-between group`;
                card.onclick = () => openCaseModal(item);

                card.innerHTML = `
                    <div>
                        <!-- Title & Subtitle -->
                        <h3 class="text-2xl sm:text-3xl font-black text-[#2d2d3a] group-hover:text-pink-500 transition-colors mb-1">
                            ${item.title}
                        </h3>
                        <p class="text-[11px] font-bold text-gray-400 mb-2 uppercase tracking-wide">${item.subtitle}</p>

                        <!-- Description -->
                        <p class="text-xs font-bold text-gray-600 leading-relaxed line-clamp-2">
                            ${item.desc}
                        </p>
                    </div>

                    <!-- Bottom Action Info -->
                    <div class="mt-4 pt-3 border-t-2 border-dashed border-gray-200 flex items-center justify-between text-xs font-black text-gray-500">
                        <span>难度: <span class="text-amber-500">${item.difficulty}</span></span>
                        <span class="text-pink-500 group-hover:translate-x-1 transition-transform flex items-center gap-1">
                            START <i class="fa-solid fa-arrow-right"></i>
                        </span>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // 主界面切换逻辑：点击 START
        function showPage(hidePage, showPage) {
            hidePage.classList.remove('page-visible');
            hidePage.classList.add('page-hidden');

            showPage.classList.remove('page-gone');
            requestAnimationFrame(() => {
                showPage.classList.remove('page-hidden');
                showPage.classList.add('page-visible');
            });

            setTimeout(() => {
                if (hidePage.classList.contains('page-hidden')) {
                    hidePage.classList.add('page-gone');
                }
            }, 400);
        }

        function startGame() {
            showPage(
                document.getElementById('page-home'),
                document.getElementById('page-cases')
            );
        }

        function goHome() {
            showPage(
                document.getElementById('page-cases'),
                document.getElementById('page-home')
            );
        }

        // 随机选择一个 Case (Random 按钮)
        function selectRandomCase() {
            if (!casesData.length) return;

            // 给按钮加个随机动画效果感
            const randomIndex = Math.floor(Math.random() * casesData.length);
            const selectedCase = casesData[randomIndex];
            
            // 稍作晃动动效后打开 Modal
            openCaseModal(selectedCase);
        }

        // 打开 Case 详情 Modal 框
        function openCaseModal(item) {
            const modal = document.getElementById('game-modal');
            const modalCard = document.getElementById('modal-card');
            selectedCase = item;

            // 填入数据
            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('modal-desc').innerText = item.desc;
            
            document.getElementById('modal-meta').innerHTML = `
                <div class="flex justify-between"><span>预估回合:</span> <span>${item.turns}</span></div>
                <div class="flex justify-between"><span>剧本难度:</span> <span class="text-amber-500">${item.difficulty}</span></div>
            `;

            // 显示 Modal
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalCard.classList.remove('scale-90');
                modalCard.classList.add('scale-100');
            }, 10);
        }

        // 关闭 Modal 框
        function closeModal() {
            const modal = document.getElementById('game-modal');
            const modalCard = document.getElementById('modal-card');

            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-90');
            modal.classList.add('opacity-0');

            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        async function startChatFromModal() {
            if (!selectedCase) {
                return;
            }

            closeModal();

            const pageChat = document.getElementById('page-chat');
            pageChat.classList.remove('ending-open');
            document.getElementById('ending-content').innerHTML = '';
            document.getElementById('chat-title').textContent = selectedCase.title;
            document.getElementById('chat-messages').innerHTML = '';
            conversationId = "";
            lastSpeaker = "";

            showPage(
                document.getElementById('page-cases'),
                pageChat
            );

            await submitChat(selectedCase.id, true);
            document.getElementById('chat-input').focus();
        }

        function leaveChat() {
            showPage(
                document.getElementById('page-chat'),
                document.getElementById('page-cases')
            );
        }

        function splitAnswer(answer) {
            return answer
                .split(/\r?\n\s*\r?\n/)
                .map((item) => item.trim())
                .filter(Boolean);
        }

        function parseMessage(raw) {
            const scene = raw.match(/^[\[［【]([\s\S]*)[\]］】]$/);

            if (scene) {
                return {
                    name: "",
                    expression: "",
                    text: scene[1].trim(),
                    scene: true
                };
            }

            const withExpression = raw.match(
                /^([^（：:\n，。！？、；…]{1,8})（([^）\n]{1,16})）[：:]\s*([\s\S]*)$/
            );

            if (withExpression) {
                return {
                    name: withExpression[1].trim(),
                    expression: withExpression[2].trim(),
                    text: withExpression[3].trim(),
                    scene: false
                };
            }

            const plain = raw.match(
                /^([^（：:\n，。！？、；…]{1,6})[：:]\s*([\s\S]*)$/
            );

            if (plain) {
                return {
                    name: plain[1].trim(),
                    expression: "",
                    text: plain[2].trim(),
                    scene: false
                };
            }

            return { name: "", expression: "", text: raw.trim(), scene: false };
        }

        function wait(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
        }

        function typeText(element, text, speed = 26) {
            return new Promise((resolve) => {
                const chars = Array.from(text);
                let index = 0;

                element.textContent = "";

                const step = () => {
                    if (index >= chars.length) {
                        scrollChatToBottom();
                        resolve();
                        return;
                    }

                    element.textContent += chars[index];
                    index += 1;

                    if (index % 3 === 0) {
                        scrollChatToBottom(false);
                    }

                    setTimeout(step, speed);
                };

                step();
            });
        }

        function createInlineRow(className) {
            const list = document.getElementById('chat-messages');
            const row = document.createElement('div');
            row.className = className;
            list.appendChild(row);
            scrollChatToBottom();
            return row;
        }

        function planAnswer(answer) {
            const items = splitAnswer(answer).map((block) => ({
                block,
                ...parseMessage(block)
            }));

            const first = items[0];
            if (
                first &&
                !first.scene &&
                !first.expression &&
                first.text.startsWith("你") &&
                first.text.length >= 24
            ) {
                first.scene = true;
                first.name = "";
            }

            let nextName = "";
            for (let i = items.length - 1; i >= 0; i -= 1) {
                if (items[i].name) {
                    nextName = items[i].name;
                }
                items[i].owner = items[i].name || nextName;
            }

            return items;
        }

        async function addAnswerMessages(answer) {
            const items = planAnswer(answer);

            for (const item of items) {
                const speakerChanged = Boolean(item.owner) && item.owner !== lastSpeaker;

                if (item.owner) {
                    lastSpeaker = item.owner;
                }

                if (speakerChanged) {
                    await wait(SPEAKER_GAP);
                }

                if (!item.name) {
                    if (item.owner && !speakerChanged) {
                        continue;
                    }

                    const narration = createInlineRow('chat-narration');
                    const narrationText = item.scene ? item.text : item.block;
                    await typeText(narration, `[${narrationText}]`, NARRATION_SPEED);
                    await wait(MESSAGE_GAP);
                    continue;
                }

                if (item.expression) {
                    const expression = createInlineRow('chat-expression');
                    await typeText(
                        expression,
                        `[${item.name}${item.expression}]`,
                        EXPRESSION_SPEED
                    );
                    await wait(EXPRESSION_GAP);
                }

                const bubble = createChatRow('other', { name: item.name });
                await typeText(bubble, item.text || item.block, TYPE_SPEED);
                await wait(MESSAGE_GAP);
            }
        }

        function isEndingAnswer(answer) {
            const text = String(answer || "").trimStart();
            return (
                text.startsWith("# 所有关系人都见完了") ||
                text.startsWith("# 你露馅了") ||
                /(^|\n)#{1,3}\s*复盘/.test(text)
            );
        }

        function renderEndingMarkdown(markdown, container) {
            container.innerHTML = "";

            const lines = String(markdown || "").split(/\r?\n/);
            let list = null;

            const appendText = (tag, text) => {
                const element = document.createElement(tag);
                element.textContent = text;
                container.appendChild(element);
            };

            for (const raw of lines) {
                const line = raw.trim();

                if (!line) {
                    list = null;
                    continue;
                }

                if (line.startsWith("### ")) {
                    list = null;
                    appendText("h3", line.slice(4).trim());
                } else if (line.startsWith("## ")) {
                    list = null;
                    appendText("h2", line.slice(3).trim());
                } else if (line.startsWith("# ")) {
                    list = null;
                    appendText("h1", line.slice(2).trim());
                } else if (/^[-*]\s+/.test(line)) {
                    if (!list) {
                        list = document.createElement("ul");
                        container.appendChild(list);
                    }
                    const item = document.createElement("li");
                    item.textContent = line.replace(/^[-*]\s+/, "");
                    list.appendChild(item);
                } else {
                    list = null;
                    appendText("p", line);
                }
            }
        }

        function openEnding(answer) {
            const page = document.getElementById("page-chat");
            const content = document.getElementById("ending-content");

            renderEndingMarkdown(answer, content);
            content.scrollTop = 0;
            page.classList.add("ending-open");
        }

        function replayGame() {
            const pageChat = document.getElementById("page-chat");
            const pageCases = document.getElementById("page-cases");

            conversationId = "";
            selectedCase = null;
            lastSpeaker = "";
            showPage(pageChat, pageCases);

            setTimeout(() => {
                pageChat.classList.remove("ending-open");
                document.getElementById("ending-content").innerHTML = "";
                document.getElementById("chat-messages").innerHTML = "";
            }, 450);
        }

        function scrollChatToBottom(smooth = true) {
            const list = document.getElementById('chat-messages');
            requestAnimationFrame(() => {
                list.scrollTo({
                    top: list.scrollHeight,
                    behavior: smooth ? 'smooth' : 'auto'
                });
            });
        }

        function createChatRow(side, meta = {}) {
            const list = document.getElementById('chat-messages');
            const row = document.createElement('div');
            row.className = side === 'me' ? 'chat-row chat-row-me' : 'chat-row';

            if (side === 'other') {
                const label = document.createElement('div');
                label.className = 'chat-label';
                label.textContent = meta.name || 'USER';
                row.appendChild(label);
            }

            const bubble = document.createElement('div');
            bubble.className = `chat-bubble chat-bubble-${side}`;
            row.appendChild(bubble);

            list.appendChild(row);
            scrollChatToBottom();
            return bubble;
        }

        function addChatMessage(side, text, meta = {}) {
            const bubble = createChatRow(side, meta);
            bubble.textContent = text;
            scrollChatToBottom();
        }

        function setChatBusy(busy) {
            document.getElementById('chat-input').disabled = busy;
            document.getElementById('chat-send').disabled = busy;
        }

        async function submitChat(text, isStart = false) {
            if (chatSending) {
                return;
            }

            chatSending = true;
            setChatBusy(true);

            if (!isStart) {
                addChatMessage('me', text);
            }

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: text,
                        conversation_id: conversationId
                    })
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || '请求失败');
                }

                conversationId = data.conversation_id || conversationId;

                if (isEndingAnswer(data.answer)) {
                    openEnding(data.answer);
                } else {
                    await addAnswerMessages(data.answer || '（没有回复）');
                }
            } catch (error) {
                addChatMessage('system', `连接失败：${error.message}`);
            } finally {
                chatSending = false;
                setChatBusy(false);
                if (!document.getElementById('page-chat').classList.contains('ending-open')) {
                    document.getElementById('chat-input').focus();
                }
            }
        }

        document.getElementById('chat-form').addEventListener('submit', (event) => {
            event.preventDefault();

            const input = document.getElementById('chat-input');
            const text = input.value.trim();

            if (!text || chatSending) {
                return;
            }

            input.value = '';
            submitChat(text);
        });
    </script>
    <script src="assets/js/wordmark.js"></script>
</body>
</html>
